<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Editor in Java | Web Application</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f, #2e2e48);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }

    .header {
      width: 100%;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .main {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 50px 40px;
      width: 350px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .glass-card h1 {
      margin-bottom: 30px;
      font-size: 26px;
      font-weight: 700;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 15px 0;
      padding: 14px;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
    }

    .btn i {
      font-size: 18px;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #ccc;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="header">
    EditPro – Text Editing Simplified
  </div>

  <div class="main">
    <div class="glass-card">
      <h1>Welcome</h1>

      <a href="Admin.jsp" class="btn"><i class="fas fa-user-shield"></i> Admin Panel</a>
      <a href="Editor.jsp" class="btn"><i class="fas fa-edit"></i> Text Editor</a>
      <a href="login.html" class="btn"><i class="fas fa-user"></i> User Login</a>

      <div class="footer">© 2025 Text Editor App</div>
    </div>
  </div>
</body>
</html>
